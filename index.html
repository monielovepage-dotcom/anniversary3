<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anniversary ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ease:cubic-bezier(.32,.72,0,1);--pink:#ff375f;--green:#30d158;--ink:#1d1d1f;--mute:#86868b}
*,*::before,*::after{box-sizing:inherit;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Prompt",-apple-system,"SF Pro Display","Helvetica Neue","Noto Sans Thai",sans-serif}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#1c1c22,#000 70%)}
#phone{position:relative;width:100%;height:100%;max-width:430px;overflow:hidden;background:#000}
@media(min-width:600px) and (min-height:720px){#phone{height:min(860px,94%);width:410px;border-radius:50px;box-shadow:0 0 0 10px #141416,0 0 0 11px #3a3a3e,0 40px 100px rgba(0,0,0,.7)}}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;visibility:hidden;transform:scale(1.05);filter:blur(14px);transition:opacity .6s var(--ease),transform .6s var(--ease),filter .6s var(--ease),visibility 0s .6s;overflow-x:hidden}
.scene.on{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .6s var(--ease),transform .6s var(--ease),filter .6s var(--ease),visibility 0s}
.light{color:var(--ink);background:linear-gradient(160deg,#fbfbfd,#eef0f5 55%,#f8e8ed)}
.pink{background:linear-gradient(160deg,#fff7f9,#ffe3ea 60%,#ffd3de)}
.stag>*{margin-bottom:0}
.scene.on .stag>*{animation:up .9s var(--ease) calc(var(--i,0)*.14s + .25s) both}
@keyframes up{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
h1{font-size:clamp(28px,8.4vw,36px);font-weight:600;line-height:1.3;letter-spacing:-.01em}
.sub{font-size:15px;color:var(--mute);font-weight:300;margin-top:10px}
.btn{font:500 19px/1 "Prompt",sans-serif;color:var(--ink);background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.06);border-radius:999px;padding:18px 28px;width:100%;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.08);backdrop-filter:blur(20px);cursor:pointer;touch-action:manipulation;transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .4s,background .4s,color .4s}
.btn:active{transform:scale(.94);transition:transform .08s}
.btn:focus-visible,.key:focus-visible{outline:2px solid #0a84ff;outline-offset:3px}
.btns{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center;margin-top:34px}
.btn.grow{transform:scale(1.1);background:linear-gradient(135deg,#ff6b8a,#ff375f);color:#fff;box-shadow:0 0 0 10px rgba(255,55,95,.15),0 14px 50px rgba(255,55,95,.55)}
.bot{position:absolute;bottom:max(36px,6vh);left:0;right:0;display:flex;justify-content:center;padding:0 24px}
.hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hrt{position:absolute;bottom:-30px;opacity:0;animation:rise linear forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0)}12%{opacity:.85}100%{opacity:0;transform:translateY(-105vh) rotate(24deg)}}

/* passcode */
.pass{--k:min(19vw,76px,10.5vh);background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.28) 38%,rgba(0,0,0,.7)),var(--wall,linear-gradient(#26262c,#000)) center/cover}
.pass .sub{color:rgba(255,255,255,.82)}.hint{display:inline-block;margin-top:8px;font-size:13px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);color:#fff}.pass h2{text-shadow:0 1px 12px rgba(0,0,0,.45)}
.pass h2{font-size:22px;font-weight:500}
.glow{position:absolute;width:340px;height:340px;top:12%;left:50%;margin-left:-170px;border-radius:50%;background:radial-gradient(circle,rgba(48,209,88,.4),transparent 68%);opacity:0;transition:opacity .6s;pointer-events:none}
.pass.ok .glow{opacity:1}
.dots{display:flex;gap:13px;margin:26px 0 12px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;transition:background .2s,transform .3s cubic-bezier(.34,1.56,.64,1),border-color .4s}
.dots i.f{background:#fff;transform:scale(1.12)}
.ok .dots i{background:var(--green);border-color:var(--green)}
.dots.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-13px)}30%{transform:translateX(11px)}45%{transform:translateX(-8px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.msg{min-height:58px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin-bottom:calc(var(--k)*.25)}
.msg b{font-weight:500;display:flex;align-items:center;gap:8px}
.msg .e{color:#ff6b6b}.msg .g{color:var(--green)}
.chk{width:20px;height:20px;border-radius:50%;background:var(--green);color:#000;font-size:12px;display:inline-flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.pad{display:grid;grid-template-columns:repeat(3,var(--k));gap:calc(var(--k)*.18) calc(var(--k)*.26)}
.key{width:var(--k);height:var(--k);border:0;border-radius:50%;background:rgba(255,255,255,.13);backdrop-filter:blur(20px);color:#fff;font:300 calc(var(--k)*.46)/1 "Prompt",sans-serif;cursor:pointer;touch-action:manipulation;transition:transform .5s cubic-bezier(.34,1.56,.64,1),background .45s}
.key:active{transform:scale(.88);background:rgba(255,255,255,.36);transition:transform .07s,background .04s}
.key.del{background:none;backdrop-filter:none;font-size:15px;font-weight:400;visibility:hidden}
.key.del.v{visibility:visible}
.sp{visibility:hidden}

/* face scan */
.key.fbtn{background:none;backdrop-filter:none;color:#fff;position:relative;display:flex;align-items:center;justify-content:center}
.key.fbtn svg{width:calc(var(--k)*.44);height:calc(var(--k)*.44)}
.key.fbtn::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);animation:ring 2.4s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.28);opacity:0}}
.scan{background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.5) 40%,rgba(0,0,0,.78)),var(--wall,linear-gradient(#26262c,#000)) center/cover}
.scan h2{font-size:22px;font-weight:500;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.scan .msg{text-shadow:0 1px 12px rgba(0,0,0,.6)}
.fid{position:relative;width:250px;height:250px;margin:34px 0 22px;display:flex;align-items:center;justify-content:center}
.fid i{position:absolute;width:46px;height:46px;border:3px solid rgba(255,255,255,.85);border-radius:16px;transition:border-color .5s}
.fid i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.fid i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.fid i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.fid i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.cir{position:relative;width:196px;height:196px;border-radius:50%;overflow:hidden;background:rgba(20,20,26,.55);backdrop-filter:blur(18px);border:2px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;transition:border-color .5s,box-shadow .6s}
.gf{width:104px;height:104px;color:rgba(255,255,255,.88);transition:color .5s;animation:look 2.4s ease-in-out infinite}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
.beam{position:absolute;left:0;right:0;height:56px;top:-56px;background:linear-gradient(transparent,rgba(130,205,255,.5),transparent);animation:beam 1.4s ease-in-out infinite alternate}
@keyframes beam{to{top:100%}}
.fid.ok i{border-color:var(--green)}
.fid.ok .cir{border-color:var(--green);box-shadow:0 0 50px rgba(48,209,88,.55)}
.fid.ok .gf{color:var(--green);animation:none}
.fid.ok .beam{display:none}
/* rejected */
.sad{color:#000;background:linear-gradient(170deg,#f4f6fa,#dfe5ee)}
.face{position:relative;font-size:92px;line-height:1;margin-bottom:22px;animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(8px)}}
.tear{position:absolute;top:58%;width:9px;height:13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#8ec5ff;opacity:0;animation:tear 2.2s ease-in infinite}
.tear:nth-child(2){left:24%}.tear:nth-child(3){right:24%;animation-delay:1.1s}
@keyframes tear{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(70px)}}

/* love + envelope */
.love h1{font-size:clamp(30px,9vw,40px)}
.blk{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0}
.love.on .blk{animation:envIn 1.3s cubic-bezier(.34,1.4,.64,1) 1.6s forwards}
@keyframes envIn{from{opacity:0;transform:translateY(140px) rotate(-9deg)}to{opacity:1;transform:translateY(0) rotate(0)}}
.lbl{font-size:17px;font-weight:500}
.ew{cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 18px 20px rgba(214,70,100,.3))}
.env{position:relative;width:230px;height:154px;background:#f1c0cc;border-radius:12px;perspective:700px;animation:float 3.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
.paper{position:absolute;left:14px;right:14px;top:10px;bottom:10px;background:#fff;border-radius:6px;z-index:1;padding:14px 16px;display:flex;flex-direction:column;gap:9px;transition:transform .9s var(--ease) .45s}
.paper i{display:block;height:5px;border-radius:3px;background:#f3d6dd}.paper i:nth-child(2){width:70%}.paper i:nth-child(3){width:85%}
.pocket{position:absolute;inset:0;border-radius:12px;background:linear-gradient(#f9dfe5,#f2c6d1);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:2}
.flap{position:absolute;left:0;right:0;top:0;height:60%;background:#e9aebb;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:3;transition:transform .6s var(--ease),z-index 0s .3s}
.seal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:4;font-size:26px;transition:opacity .3s,transform .3s}
.open .flap{transform:rotateX(180deg);z-index:0}
.open .paper{transform:translateY(-62px)}
.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4)}
.pill{font:500 15px/1 "Prompt",sans-serif;color:#fff;background:linear-gradient(135deg,#ff6b8a,#ff375f);border:0;border-radius:999px;padding:14px 24px;box-shadow:0 8px 24px rgba(255,55,95,.4);cursor:pointer;touch-action:manipulation;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.pill:active{transform:scale(.93);transition:transform .08s}
.letter .ew{transform:scale(1.3);margin-bottom:60px;margin-top:70px}

/* anniversary */
.ann{justify-content:flex-start;overflow-y:auto;background:linear-gradient(175deg,#fffafb,#f6f1f6 50%,#fde6ec)}
.in{margin:auto 0;padding:26px 0;width:100%;display:flex;flex-direction:column;align-items:center}
.in h1{font-size:clamp(24px,7.2vw,31px);letter-spacing:.02em}
.frame{width:min(78%,290px);margin:26px 0 26px;background:#fff;border-radius:28px;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.05);overflow:hidden}
.ph{aspect-ratio:4/5;border-radius:21px;border:1.5px dashed #e5aebb;background:linear-gradient(160deg,#fff5f7,#ffe7ed);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:16px;color:#d6456a;font-weight:500}
.ph span{font-size:34px}.ph small{font-size:11px;letter-spacing:.14em;color:#e08ca1;font-weight:400}
.f2{margin:26px 0 0}.f2:empty{display:none}.frame img{display:block;width:100%;height:auto;max-height:52vh;object-fit:contain;border-radius:21px}
.msgtxt{font-size:15.5px;line-height:1.85;font-weight:400;color:#000;max-width:310px;white-space:pre-line}
.ann h1,.love2{color:#000}
.msgtxt p+p{margin-top:16px}
.love2{font-size:22px;font-weight:500;margin:26px 0 18px}
.ghost{font:400 14px/1 "Prompt",sans-serif;color:var(--ink);background:rgba(0,0,0,.06);border:0;border-radius:999px;padding:13px 22px;cursor:pointer;touch-action:manipulation;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.ghost:active{transform:scale(.92);transition:transform .08s}
.pair{display:flex;justify-content:center;align-items:flex-start;margin-bottom:26px}
.pair:empty,.face:empty{display:none}
.pol{position:relative;width:var(--w,100px);background:#fff;padding:6px 6px 22px;border-radius:5px;box-shadow:0 10px 26px rgba(0,0,0,.18);transform:rotate(var(--r,0deg))}
.pol::before{content:"";position:absolute;top:-8px;left:50%;width:40px;height:14px;margin-left:-20px;background:rgba(255,190,206,.78);transform:rotate(-4deg)}
.pol img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px}
#pq{--w:min(29vw,112px,15vh)}
#pq .pol+.pol{margin-left:-12px;margin-top:16px}
#pl{--w:min(25vw,100px,14vh)}
.face .pol{--w:min(48vw,176px,27vh)}
.face .pol img{filter:grayscale(.5) brightness(.96)}
/* landscape phones */
@media (orientation:landscape) and (max-height:520px){
#phone{max-width:none;width:100%;height:100%;border-radius:0;box-shadow:none}
.scene{padding:14px max(24px,env(safe-area-inset-right)) 14px max(24px,env(safe-area-inset-left))}
.pass{--k:min(17vh,64px);display:grid;grid-template-columns:auto auto;grid-template-rows:1fr repeat(4,auto) 1fr;column-gap:min(12vw,70px);justify-content:center;justify-items:center}
.pass>h2{grid-column:1;grid-row:2}.pass>.sub{grid-column:1;grid-row:3;margin-top:4px!important}
.pass>.dots{grid-column:1;grid-row:4;margin:16px 0 8px}.pass>.msg{grid-column:1;grid-row:5;margin-bottom:0}
.pass>.pad{grid-column:2;grid-row:1/span 6;align-self:center}
.scan{display:grid;grid-template-columns:auto minmax(0,250px);grid-template-rows:1fr auto auto auto 1fr;column-gap:44px;justify-content:center;justify-items:center}
.scan>h2{grid-column:2;grid-row:2}.scan>.fid{grid-column:1;grid-row:1/span 5;align-self:center;margin:0}
.scan>.msg{grid-column:2;grid-row:3;margin:10px 0}.scan .bot{position:static;grid-column:2;grid-row:4;padding:0;width:100%}
[data-s=question] .stag,[data-s=rejected] .stag{display:grid;grid-template-columns:auto minmax(0,300px);column-gap:44px;align-items:center}
[data-s=question] .stag>.pair,[data-s=rejected] .stag>.face{grid-column:1;grid-row:1/span 4;margin:0}
[data-s=question] .stag>:not(.pair),[data-s=rejected] .stag>:not(.face){grid-column:2}
.btns{margin-top:20px}
#pq{--w:min(24vh,104px)}#pl{--w:min(30vh,120px)}.face .pol{--w:min(40vh,150px)}
[data-s=rejected] .bot{bottom:14px}
.love{flex-direction:row;gap:44px}.love h1{font-size:30px}.love .pair{margin-bottom:14px}.love .blk{margin-top:0}
.letter .ew{margin:28px 0 36px}
.ann .in{display:grid;grid-template-columns:auto minmax(0,320px);column-gap:40px;justify-content:center;align-items:center;justify-items:center;padding:18px 0}
.ann .in>.frame{grid-column:1;grid-row:1/span 5;width:clamp(150px,50vh,250px);margin:0}
.ann .in>:not(.frame){grid-column:2}.ann .in>.f2{grid-column:2;grid-row:auto;width:min(100%,220px);margin:12px 0 0}
.ann h1{margin-bottom:12px}.love2{margin:14px 0 12px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main id="phone">

<section class="scene pass on" data-s="passcode" id="sp">
  <div class="glow"></div>
  <h2>Enter Passcode</h2>
  <p class="sub" style="margin-top:6px">กรุณาใส่รหัสปลดล็อค <span id="plen">8</span> หลัก<br><span class="hint" id="phint"></span></p>
  <div class="dots" id="dots"></div>
  <div class="msg" id="msg"></div>
  <div class="pad" id="pad"></div>
</section>

<section class="scene scan" data-s="scan">
  <h2>Face ID</h2>
  <div class="fid" id="fid"><i></i><i></i><i></i><i></i>
    <div class="cir">
      <svg class="gf" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12v3M20 12v3M16 12v6h-1.5M12 22c2.4 2 5.6 2 8 0"/></svg>
      <div class="beam"></div>
    </div>
  </div>
  <div class="msg" id="smsg"></div>
  <div class="bot"><button class="btn" id="scancancel">ใช้รหัสแทน</button></div>
</section>

<section class="scene light" data-s="question">
  <div class="stag">
    <div class="pair" id="pq"></div>
    <h1>รักเค้าไหม? ❤️</h1>
    <p class="sub">ตอบตามความรู้สึกจริง ๆ นะ</p>
    <div class="btns">
      <button class="btn" id="yes">รัก ❤️</button>
      <button class="btn" id="no">ไม่รัก 🥺</button>
    </div>
  </div>
  <div class="hearts" id="hq"></div>
</section>

<section class="scene sad" data-s="rejected">
  <div class="stag">
    <div class="face" id="pr"></div>
    <h1>เสียใจ เธอไม่รักเค้า 🥺</h1>
  </div>
  <div class="bot"><button class="btn" id="back">ย้อนกลับ</button></div>
</section>

<section class="scene light pink love" data-s="love">
  <div class="hearts" id="hl"></div>
  <div class="stag">
    <div class="pair" id="pl"></div>
    <h1>เค้าก็รักเธอที่สุดดด ❤️</h1>
    <p class="sub">ขอบคุณที่ยังอยู่ข้างกันนะ</p>
  </div>
  <div class="blk">
    <div class="lbl">มีจดหมายถึงเธอ 💌</div>
    <div class="ew" id="e1"></div>
    <button class="pill" id="hint">แตะจดหมายเพื่อเปิด 💌</button>
  </div>
</section>

<section class="scene light pink letter" data-s="letter">
  <div class="hearts" id="hp"></div>
  <div class="ew" id="e2"></div>
  <p class="sub">กำลังเปิดจดหมาย…</p>
</section>

<section class="scene ann" data-s="anniversary">
  <div class="hearts" id="ha"></div>
  <div class="in stag">
    <h1 id="title"></h1>
    <div class="frame" id="frame"><div class="ph"><span>📷</span>ใส่รูปของเราไว้ตรงนี้ ❤️<small>YOUR PHOTO HERE</small></div></div>
    <div class="msgtxt" id="text"></div>
    <div class="frame f2" id="frame2"></div>
    <div class="love2">รักเธอนะ ❤️</div>
    <button class="ghost" id="again">อ่านอีกครั้ง</button>
  </div>

<script>
/* ========== CONFIG — แก้ไขได้ตรงนี้ ========== */
const correctPasscode = "251069";   // รหัส 6 ตัว
const passcodeHint = "วันสำคัญของเรา";
const lockWallpaper = PHOTOS.wall;      // รูปพื้นหลังหน้าใส่รหัส
const anniversaryImage = PHOTOS.main;   // รูปหลักหน้า Anniversary (เว้นว่าง "" = โชว์กรอบเปล่า)
const photoQuestion = [PHOTOS.q1, PHOTOS.q2];   // หน้า "รักเค้าไหม?" (ใส่ 1-2 รูป)
const photoRejected = PHOTOS.rej;                  // หน้า "เสียใจ เธอไม่รักเค้า"
const photoLove = PHOTOS.love;                      // หน้า "เค้าก็รักเธอที่สุดดด"
const memoriesImage = [PHOTOS.col, PHOTOS.col2, PHOTOS.col3];   // รูปใต้ข้อความจดหมาย (ใส่ได้หลายรูป, [] = ไม่แสดง)
const anniversaryTitle = "Happy Anniversary";
const anniversaryMessage = `
สุขสันต์วันครบรอบน๊า

ขอบคุณนะที่ยังอยู่กับเค้า อาจจะเป็นเวลาไม่นานเท่าไหร่ที่เราอยู่ด้วยกัน

ช่วงเวลาที่ผ่านมาเค้ามีความสุขมากๆที่มีอ้วน ขอบคุณที่เข้ามาเป็นความสุขให้เค้านะ

อ้วนอยู่กับเค้าคนนี้ไปนานๆนะ เค้าจะอยู่ข้างๆแบมเสมอ ในวันนี้เธอเหนื่อยหันมาเมื่อไหร่ก็เจอเค้านะ

เค้ารักแบมที่สุดเลย
`;
/* ============================================= */

const $ = s => document.querySelector(s);
const scenes = {};
document.querySelectorAll('.scene').forEach(s => scenes[s.dataset.s] = s);
document.querySelectorAll('.stag').forEach(c => [...c.children].forEach((e, i) => e.style.setProperty('--i', i)));

let state = 'passcode', lock = false, timers = [], hi = null, code = '';
const later = (f, ms) => timers.push(setTimeout(f, ms));

/* hearts */
function heart(box) {
  const h = document.createElement('span');
  h.className = 'hrt';
  h.textContent = ['❤️', '💗', '🤍', '💕'][Math.floor(Math.random() * 4)];
  h.style.cssText = `left:${Math.random() * 94}%;font-size:${12 + Math.random() * 16}px;animation-duration:${4.5 + Math.random() * 3}s`;
  box.appendChild(h);
  h.onanimationend = () => h.remove();
}
const burst = (box, n) => { for (let i = 0; i < n; i++) later(() => heart(box), i * 90); };
const stream = (box, ms) => { hi = setInterval(() => heart(box), ms); };

/* navigation */
const onEnter = {
  passcode() { code = ''; renderDots(); scenes.passcode.classList.remove('ok'); $('#msg').innerHTML = ''; },
  question() { $('#yes').classList.remove('grow'); },
  scan() {
    const f = $('#fid'); f.classList.remove('ok');
    $('#smsg').innerHTML = '<b>มองที่หน้าจอแล้วรอสักครู่</b>';
    later(() => { $('#smsg').innerHTML = '<b>กำลังสแกนหน้า…</b>'; }, 900);
    later(() => { f.classList.add('ok'); $('#smsg').innerHTML = '<b class="g"><span class="chk">✓</span>สแกนหน้าสำเร็จ</b><b>ปลดล็อคสำเร็จ 🔓</b>'; }, 3200);
    later(() => go('question'), 4600);
  },
  love() { burst($('#hl'), 10); stream($('#hl'), 900); },
  letter() {
    $('#e2').classList.remove('open');
    later(() => $('#e2').classList.add('open'), 500);
    later(() => go('anniversary'), 2500);
  },
  anniversary() { stream($('#ha'), 1400); $('#phone').querySelector('.ann').scrollTop = 0; }
};
function go(n) {
  timers.forEach(clearTimeout); timers = [];
  clearInterval(hi);
  scenes[state].classList.remove('on');
  state = n; lock = false;
  scenes[n].classList.add('on');
  onEnter[n] && onEnter[n]();
}

/* passcode */
const FIDSVG = '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V8a4 4 0 0 1 4-4h3M21 4h3a4 4 0 0 1 4 4v3M28 21v3a4 4 0 0 1-4 4h-3M11 28H8a4 4 0 0 1-4-4v-3"/><path d="M12 12v3M20 12v3M16 12v6h-1.5M12 22c2.4 2 5.6 2 8 0"/></svg>';
for (let i = 0; i < correctPasscode.length; i++) $('#dots').appendChild(document.createElement('i'));
$('#plen').textContent = correctPasscode.length;
if (passcodeHint) { $('#phint').textContent = '💡 คำใบ้: ' + passcodeHint; } else { $('#phint').style.display = 'none'; const br = $('#phint').previousElementSibling; if (br && br.tagName === 'BR') br.style.display = 'none'; }
const pad = $('#pad');
'123456789'.split('').concat(['', '0', 'del']).forEach(k => {
  const b = document.createElement('button');
  if (k === '') { b.className = 'key fbtn'; b.setAttribute('aria-label', 'สแกนหน้า'); b.innerHTML = FIDSVG; b.onclick = startScan; }
  else if (k === 'del') { b.className = 'key del'; b.id = 'del'; b.textContent = 'ลบ'; b.onclick = del; }
  else { b.className = 'key'; b.textContent = k; b.onclick = () => press(k); }
  pad.appendChild(b);
});
function renderDots() {
  document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('f', i < code.length));
  $('#del').classList.toggle('v', code.length > 0);
}
function press(d) {
  if (lock || state !== 'passcode' || code.length >= correctPasscode.length) return;
  code += d; renderDots();
  $('#msg').innerHTML = '';
  if (code.length === correctPasscode.length) { lock = true; later(check, 220); }
}
function del() {
  if (lock || state !== 'passcode') return;
  code = code.slice(0, -1); renderDots();
}
function check() {
  if (code === correctPasscode) {
    scenes.passcode.classList.add('ok');
    $('#msg').innerHTML = '<b class="g"><span class="chk">✓</span>รหัสถูกต้อง</b><b>ปลดล็อคสำเร็จ 🔓</b>';
    later(() => go('question'), 1200);
  } else {
    const dots = $('#dots');
    dots.classList.add('shake');
    $('#msg').innerHTML = '<b class="e">รหัสไม่ถูกต้อง</b>' + (passcodeHint ? '<b style="font-size:13px;opacity:.85">💡 คำใบ้: ' + passcodeHint + '</b>' : '');
    later(() => { dots.classList.remove('shake'); code = ''; renderDots(); lock = false; }, 520);
  }
}
document.addEventListener('keydown', e => {
  if (state !== 'passcode') return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') del();
});

/* face scan (simulated — ไม่เปิดกล้อง) */
function startScan() { if (lock || state !== 'passcode') return; lock = true; go('scan'); }
$('#scancancel').onclick = () => { if (lock || state !== 'scan') return; lock = true; go('passcode'); };

/* question */
$('#no').onclick = () => { if (lock || state !== 'question') return; lock = true; go('rejected'); };
$('#back').onclick = () => { if (lock || state !== 'rejected') return; lock = true; go('question'); };
$('#yes').onclick = () => {
  if (lock || state !== 'question') return;
  lock = true;
  $('#yes').classList.add('grow');
  burst($('#hq'), 12);
  later(() => go('love'), 900);
};

/* envelope */
const ENV = '<div class="env"><div class="paper"><i></i><i></i><i></i></div><div class="pocket"></div><div class="flap"></div><div class="seal">❤️</div></div>';
$('#e1').innerHTML = ENV; $('#e2').innerHTML = ENV;
const openLetter = () => { if (lock || state !== 'love') return; lock = true; go('letter'); };
$('#e1').onclick = openLetter; $('#hint').onclick = openLetter;

/* anniversary content */
$('#title').textContent = anniversaryTitle;
$('#text').innerHTML = '';
anniversaryMessage.trim().split(/\n\s*\n/).forEach(t => {
  const p = document.createElement('p'); p.textContent = t.trim(); $('#text').appendChild(p);
});
if (anniversaryImage && anniversaryImage !== 'YOUR_IMAGE_PATH_HERE') {
  const img = new Image();
  img.alt = 'รูปของเรา';
  img.onload = () => { $('#frame').innerHTML = ''; $('#frame').appendChild(img); };
  img.src = anniversaryImage;
}
{ let prevF = $('#frame2'); [].concat(memoriesImage || []).filter(Boolean).forEach((src, i) => { let f = prevF; if (i > 0) { f = document.createElement('div'); f.className = 'frame f2'; prevF.after(f); } const m = new Image(); m.alt = 'ความทรงจำของเรา'; m.src = src; f.appendChild(m); prevF = f; }); }
$('#again').onclick = () => { if (lock || state !== 'anniversary') return; lock = true; go('passcode'); };
if (lockWallpaper) ['passcode', 'scan'].forEach(k => scenes[k].style.setProperty('--wall', 'url("' + lockWallpaper + '")'));
function addPol(box, src, rot) {
  if (!src) return;
  const d = document.createElement('div'); d.className = 'pol'; d.style.setProperty('--r', rot + 'deg');
  const im = new Image(); im.alt = ''; im.src = src; d.appendChild(im); box.appendChild(d);
}
photoQuestion.forEach((s, i) => addPol($('#pq'), s, [-5, 4][i % 2]));
